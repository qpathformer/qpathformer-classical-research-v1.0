name: Repository checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation-links:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proposed files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned Markdown parser
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/ci/requirements.txt
      - name: Test link-checker failure cases
        run: python -m unittest discover -s .github/ci/tests -p 'test*links*.py' -v
      - name: Check selected current documentation
        run: python .github/ci/check_readme_links.py --scope-file .github/ci/documentation-scope.json

  content-scope:
    name: Content scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out files and historical identity sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test identity-verifier failure cases
        run: python -m unittest discover -s .github/ci/tests -p 'test_content_scope.py' -v
      - name: Check current scope identities
        run: python .github/ci/check_content_scope.py
